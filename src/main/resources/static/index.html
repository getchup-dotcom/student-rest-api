<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 25px 0;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .student {
            padding: 15px;
            margin: 12px 0;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .student h3 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .details {
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .empty {
            color: #64748b;
        }

        .count {
            color: #2563eb;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <p class="subtitle">
        Register and manage student records
    </p>

    <!-- REGISTRATION FORM -->
    <div class="card">

        <h2>Student Registration</h2>

        <p>All fields marked with * are mandatory.</p>

        <form id="studentForm">

            <div class="form-grid">

                <div>
                    <label for="name">Full Name *</label>
                    <input
                            id="name"
                            name="name"
                            type="text"
                            required
                            minlength="3"
                            maxlength="100"
                            pattern=".*\S.*"
                            title="Name must contain at least 3 characters.">
                </div>

                <div>
                    <label for="rollNumber">Roll Number *</label>
                    <input
                            id="rollNumber"
                            name="rollNumber"
                            type="text"
                            required
                            maxlength="11"
                            pattern=".{1,11}"
                            title="Roll number must not exceed 11 characters.">
                </div>

                <div>
                    <label for="studentClass">Class *</label>
                    <input
                            id="studentClass"
                            name="class"
                            type="text"
                            required
                            maxlength="50">
                </div>

                <div>
                    <label for="section">Section *</label>
                    <input
                            id="section"
                            name="section"
                            type="text"
                            required
                            minlength="1"
                            maxlength="10">
                </div>

                <div>
                    <label for="phone">Phone Number *</label>
                    <input
                            id="phone"
                            name="phone"
                            type="tel"
                            required
                            inputmode="numeric"
                            pattern="[0-9]{10}"
                            minlength="10"
                            maxlength="10"
                            title="Enter exactly 10 digits.">
                </div>

                <div>
                    <label for="email">Email *</label>
                    <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            maxlength="254"
                            pattern="[^@\s]+@[^@\s]+\.com"
                            title="Enter an email address ending in .com.">
                </div>

                <div>
                    <label for="dob">Date of Birth *</label>
                    <input
                            id="dob"
                            name="dateOfBirth"
                            type="date"
                            required>
                </div>

                <div>
                    <label for="gender">Gender *</label>
                    <select
                            id="gender"
                            name="gender"
                            required>

                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">
                            Prefer not to say
                        </option>

                    </select>
                </div>

                <div>
                    <label for="course">Course / Stream *</label>
                    <input
                            id="course"
                            name="course"
                            type="text"
                            required
                            maxlength="100">
                </div>

                <div>
                    <label for="percentage">Percentage *</label>
                    <input
                            id="percentage"
                            name="percentage"
                            type="number"
                            required
                            min="0"
                            max="100"
                            step="0.01">
                </div>

                <div>
                    <label for="father">Father's Name *</label>
                    <input
                            id="father"
                            name="fatherName"
                            type="text"
                            required
                            minlength="3"
                            maxlength="100"
                            pattern=".*\S.*"
                            title="Enter at least 3 characters.">
                </div>

                <div>
                    <label for="mother">Mother's Name *</label>
                    <input
                            id="mother"
                            name="motherName"
                            type="text"
                            required
                            minlength="3"
                            maxlength="100"
                            pattern=".*\S.*"
                            title="Enter at least 3 characters.">
                </div>

                <div style="grid-column: 1 / -1;">
                    <label for="address">Address *</label>
                    <textarea
                            id="address"
                            name="address"
                            rows="3"
                            required
                            minlength="5"
                            maxlength="500"></textarea>
                </div>

            </div>

            <div class="actions">

                <button class="add-btn" type="submit">
                    Register Student
                </button>

                <button type="reset">
                    Clear Form
                </button>

            </div>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

    </div>


    <!-- REGISTERED STUDENTS -->
    <div class="card">

        <h2>
            Registered Students:
            <span class="count" id="studentCount">0</span>
        </h2>

        <button
                type="button"
                class="add-btn"
                id="refreshBtn">
            Refresh Records
        </button>

        <div id="studentsList">
            <p class="empty">Loading students...</p>
        </div>

    </div>

</div>


<script>

    const API = "/students";

    const form = document.getElementById("studentForm");

    const message = document.getElementById("message");

    const studentsList = document.getElementById("studentsList");

    const studentCount = document.getElementById("studentCount");


    // REGISTER A STUDENT
    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        message.textContent = "";

        // Reject fields containing only spaces.
        const fields = form.querySelectorAll(
            "input, select, textarea"
        );

        for (const field of fields) {

            if (field.required && !field.value.trim()) {
                field.setCustomValidity("This field is required.");
            } else {
                field.setCustomValidity("");
            }

        }

        // Run browser validation before sending data.
        if (!form.reportValidity()) {
            return;
        }

        // Collect all form values.
        const student = {};

        new FormData(form).forEach((value, key) => {
            student[key] = value.trim();
        });

        try {

            const response = await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(student)

            });

            const result = await response.json();

            // The backend may reject invalid data.
            if (!response.ok) {

                const errors = result.errors
                    ? result.errors.join(" ")
                    : result.error || "Registration failed.";

                throw new Error(errors);
            }

            message.textContent =
                "Student registered successfully! Student ID: "
                + result.id;

            message.style.color = "green";

            form.reset();

            await loadStudents();

        } catch (error) {

            message.textContent = error.message;

            message.style.color = "red";

        }

    });


    // LOAD ALL REGISTERED STUDENTS
    async function loadStudents() {

        try {

            const response = await fetch(API);

            if (!response.ok) {
                throw new Error("Unable to retrieve student records.");
            }

            const students = await response.json();

            // Update the total count.
            studentCount.textContent = students.length;

            // Clear the previous list.
            studentsList.replaceChildren();

            if (students.length === 0) {

                const p = document.createElement("p");

                p.className = "empty";

                p.textContent = "No students registered yet.";

                studentsList.appendChild(p);

                return;
            }

            // Display each student.
            students.forEach(student => {

                const card = document.createElement("div");

                card.className = "student";

                const heading = document.createElement("h3");

                heading.textContent =
                    student.name + " (ID: " + student.id + ")";

                const details = document.createElement("div");

                details.className = "details";

                Object.entries(student).forEach(([key, value]) => {

                    if (key === "id") {
                        return;
                    }

                    const row = document.createElement("div");

                    const label = document.createElement("strong");

                    label.textContent = key + ": ";

                    row.append(
                        label,
                        document.createTextNode(String(value))
                    );

                    details.appendChild(row);

                });


                // DELETE BUTTON
                const deleteButton = document.createElement("button");

                deleteButton.className = "delete-btn";

                deleteButton.textContent = "Delete Student";

                deleteButton.addEventListener("click", async function () {

                    const confirmed = confirm(
                        "Are you sure you want to delete this student?"
                    );

                    if (!confirmed) {
                        return;
                    }

                    try {

                        const response = await fetch(
                            API + "/" + student.id,
                            {
                                method: "DELETE"
                            }
                        );

                        if (!response.ok) {
                            throw new Error("Could not delete student.");
                        }

                        message.textContent =
                            "Student deleted successfully.";

                        message.style.color = "green";

                        await loadStudents();

                    } catch (error) {

                        message.textContent = error.message;

                        message.style.color = "red";

                    }

                });


                card.append(
                    heading,
                    details,
                    deleteButton
                );

                studentsList.appendChild(card);

            });

        } catch (error) {

            studentsList.textContent =
                "Could not load student records. "
                + error.message;

        }

    }


    // REFRESH BUTTON
    document.getElementById("refreshBtn")
        .addEventListener("click", loadStudents);


    // LOAD RECORDS WHEN THE PAGE OPENS
    loadStudents();

</script>

</body>
</html>
